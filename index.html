<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChurchBell App</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f9fafb;
    }

    main {
      max-width: 42rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin-bottom: 0.75rem;
      font-size: clamp(2.5rem, 6vw, 4rem);
    }

    p {
      margin: 0;
      font-size: 1.125rem;
      line-height: 1.6;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <main>
    <h1>ChurchBell App</h1>
    <p>The official website for ChurchBell App is now hosted at churchbell.app.</p>
  </main>
</body>
</html>
